services:
  inkcraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: inkcraft:latest
    container_name: inkcraft
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "3000:3000"
    environment:
      # 时区配置
      - TZ=Asia/Shanghai
      # 访问控制：公网部署时配置访问口令（留空则不开启密码门禁）
      - ACCESS_PASSWORD=
      # 注意：大模型提供商与 API Key 不在环境变量/配置文件中配置，
      # 部署启动后请直接访问网页后台「系统设置 (/settings)」页面可视化添加并分配通道。
    volumes:
      # SQLite 数据文件持久化挂载（保存所有知识库、卡片、模型设置、选题与成果）
      - inkcraft_data:/app/data
      # 亦可使用宿主机本地相对目录直接挂载（取消注释并注释上一行）：
      # - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/settings || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  inkcraft_data:
    name: inkcraft_sqlite_data
