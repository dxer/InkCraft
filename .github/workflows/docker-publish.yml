name: Build and Publish Docker Image & Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "v*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      push_image:
        description: "是否推送镜像到 GHCR 镜像仓库"
        required: true
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  # 镜像名称转为小写：ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ================= Job 1: 构建并发布多架构 Docker 镜像 =================
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU 跨架构仿真 (用于 amd64/arm64 多架构编译)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Packages 容器镜像仓库 (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据 (Tags / Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-cache
          cache-to: type=gha,scope=build-cache,ignore-error=true,mode=max,enabled=${{ github.event_name != 'pull_request' }}

  # ================= Job 2: 构建并打包浏览器剪藏扩展插件 =================
  build-extension:
    name: Build Browser Clipper Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许上传 assets 到 GitHub Releases

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: 安装扩展依赖并执行构建
        working-directory: extension
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 打包扩展为 Zip 和 CRX 格式
        run: |
          # 1. 产出 Zip 压缩包（适合解压后直接加载文件夹）
          cd extension/dist
          zip -r ../../inkcraft-clipper.zip .
          cd ../..

          # 2. 使用 crx3 打包 CRX 文件（适合直接拖拽安装）
          npx --yes crx3 -o inkcraft-clipper.crx extension/dist

      - name: 上传扩展产物 (GitHub Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: inkcraft-clipper
          path: |
            inkcraft-clipper.zip
            inkcraft-clipper.crx
          retention-days: 30

      - name: 挂载到 GitHub Release 附件 (仅发布 Tag 时自动关联)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            inkcraft-clipper.zip
            inkcraft-clipper.crx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
