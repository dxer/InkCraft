# ============================================================
# 墨匠 (InkCraft) - 本地编译部署配置：从源码构建镜像
# ------------------------------------------------------------
# 用法：docker compose -f docker-compose.build.yml up -d --build
# 适合开发调试或改完源码自用；多数用户请直接用默认的 docker-compose.yml
# （拉取 ghcr.io/dxer/inkcraft 预编译镜像，无需本地构建）。
# 两个文件共用同级 ./data 目录持久化，随时互换数据不丢。
# ============================================================

services:
  inkcraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: inkcraft:local
    container_name: inkcraft
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "3000:3000"
    environment:
      # 时区配置
      - TZ=Asia/Shanghai
      # 访问控制：公网部署时配置访问口令（留空则不开启密码门禁）。
      # 注意：= 后面的值原样生效，YAML 不会去掉引号——写成 "123" 时密码就是带引号的 "123"
      - ACCESS_PASSWORD=
      # 反向代理（nginx/Caddy 等）部署时设为 true：登录限流采信真实客户端 IP（X-Forwarded-For）、
      # Cookie Secure 标记采信 X-Forwarded-Proto；直连部署保持默认（代理头可被伪造）
      # - TRUST_PROXY=true
      # 注意：大模型提供商与 API Key 不在环境变量/配置文件中配置，
      # 部署启动后请直接访问网页后台「系统设置 (/settings)」页面可视化添加并分配通道。
    volumes:
      # 直接挂载到 docker-compose.build.yml 所在同级目录的 ./data 文件夹（方便备份与迁移）
      - ./data:/app/data
    healthcheck:
      # /login 为免鉴权公开路径；/api/settings 在门禁开启后返回 401，会导致永远 unhealthy
      test: ["CMD-SHELL", "curl -f http://localhost:3000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
